<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#A8DADC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bernardo">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Di%C3%A1rio%20do%20Bernardo%22%2C%22short_name%22%3A%22Bernardo%22%2C%22start_url%22%3A%22.%2F%22%2C%22scope%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23A8DADC%22%2C%22lang%22%3A%22pt-PT%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Bcharset%3Dutf-8%2C%253Csvg%2520xmlns%253D%2527http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2527%2520viewBox%253D%25270%25200%2520100%2520100%2527%253E%253Crect%2520width%253D%2527100%2527%2520height%253D%2527100%2527%2520rx%253D%252720%2527%2520fill%253D%2527%2523A8DADC%2527%252F%253E%253Ctext%2520x%253D%252750%2527%2520y%253D%252766%2527%2520font-size%253D%252750%2527%2520text-anchor%253D%2527middle%2527%253E%25F0%259F%2591%25B6%253C%252Ftext%253E%253C%252Fsvg%253E%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22sizes%22%3A%22any%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23A8DADC'/><text x='50' y='66' font-size='50' text-anchor='middle'>👶</text></svg>">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23A8DADC'/><text x='50' y='66' font-size='50' text-anchor='middle'>👶</text></svg>">
<title>Diário do Bernardo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        mint: { 50:'#F0FAFB', 100:'#DDF3F4', 200:'#A8DADC', 300:'#7BC7CA', 400:'#4FB0B4', 500:'#2E9599' },
        rose: { 100:'#FBE4E7', 200:'#F1B0B7', 300:'#E38A94', 400:'#D26571' },
        sand: { 50:'#FAF7F2', 100:'#F1ECE1', 200:'#E4DBC8' }
      },
      fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"SF Pro Text"','Inter','system-ui','sans-serif'] }
    }
  }
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  html,body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  body { font-size: 17px; padding-bottom: env(safe-area-inset-bottom); padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.75rem); }
  [x-cloak] { display: none !important; }
  .btn-tap { transition: transform .08s ease, background-color .15s ease; }
  .btn-tap:active { transform: scale(0.97); }
  .num-input { font-variant-numeric: tabular-nums; }
  input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  input[type="number"] { -moz-appearance: textfield; }
  .sheet-enter { animation: sheetUp .22s ease-out; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .backdrop-enter { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .segbtn[data-active="true"] { background: #A8DADC; color: #0f172a; }
  .dark .segbtn[data-active="true"] { background: #2E9599; color: #f8fafc; }
</style>
</head>
<body class="bg-mint-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen" x-data="app()" x-init="init()" x-cloak :class="theme==='dark'?'dark':''">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 bg-mint-50/85 dark:bg-slate-950/85 backdrop-blur border-b border-mint-200/60 dark:border-slate-800">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <div class="text-3xl leading-none">👶</div>
    <div class="flex-1 min-w-0">
      <div class="font-semibold truncate" x-text="profile.name || 'Bebé'"></div>
      <div class="text-xs text-slate-500 dark:text-slate-400 num-input">
        <span x-text="ageText"></span>
        <template x-if="profile.dob"><span> · <span x-text="correctedAgeText"></span></span></template>
      </div>
    </div>
    <button class="btn-tap p-2 rounded-full hover:bg-mint-100 dark:hover:bg-slate-800" @click="toggleTheme()" aria-label="Tema">
      <svg x-show="theme!=='dark'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg x-show="theme==='dark'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
    <button class="btn-tap p-2 rounded-full hover:bg-mint-100 dark:hover:bg-slate-800" @click="openSheet('settings')" aria-label="Definições">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.757.426 1.757 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.757-2.924 1.757-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.757-.426-1.757-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <!-- Tab bar -->
  <div class="max-w-md mx-auto px-2 pb-2">
    <div class="grid grid-cols-3 gap-1 bg-mint-100 dark:bg-slate-800/60 rounded-xl p-1">
      <template x-for="t in tabs" :key="t.id">
        <button class="btn-tap py-2 rounded-lg text-sm font-medium"
                :class="tab===t.id ? 'bg-white dark:bg-slate-900 shadow-sm text-mint-500 dark:text-mint-200' : 'text-slate-600 dark:text-slate-300'"
                @click="tab=t.id" x-text="t.label"></button>
      </template>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-3 pb-32">

  <!-- =========================================================
       TAB: HOJE
       ========================================================= -->
  <section x-show="tab==='today'">

    <!-- Alerta setup -->
    <template x-if="!profile.dob">
      <div class="mb-4 p-4 rounded-2xl bg-rose-100 dark:bg-rose-400/20 border border-rose-200 dark:border-rose-400/40">
        <div class="font-semibold mb-1">Configura o perfil</div>
        <div class="text-sm mb-3">Precisamos da data de nascimento e peso para calcular metas.</div>
        <button class="btn-tap px-4 py-2 rounded-xl bg-rose-200 dark:bg-rose-400/40 font-medium" @click="openSheet('settings')">Abrir definições</button>
      </div>
    </template>

    <!-- Resumo do dia -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800">
        <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Mamadas hoje</div>
        <div class="mt-1 flex items-baseline gap-1">
          <span class="text-3xl font-semibold num-input" x-text="today.feedings"></span>
          <span class="text-slate-500 dark:text-slate-400 text-sm">/ <span x-text="settings.target_feedings_per_day"></span></span>
        </div>
        <div class="mt-2 h-1.5 rounded-full bg-mint-100 dark:bg-slate-800 overflow-hidden">
          <div class="h-full bg-mint-300" :style="`width:${Math.min(100, today.feedings/settings.target_feedings_per_day*100)}%`"></div>
        </div>
      </div>
      <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800">
        <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Fraldas molhadas</div>
        <div class="mt-1 flex items-baseline gap-1">
          <span class="text-3xl font-semibold num-input" x-text="today.wetDiapers"></span>
          <span class="text-slate-500 dark:text-slate-400 text-sm">/ <span x-text="settings.min_wet_diapers"></span></span>
        </div>
        <div class="mt-2 h-1.5 rounded-full bg-mint-100 dark:bg-slate-800 overflow-hidden">
          <div class="h-full" :class="today.wetDiapers>=settings.min_wet_diapers?'bg-mint-300':'bg-rose-300'" :style="`width:${Math.min(100, today.wetDiapers/settings.min_wet_diapers*100)}%`"></div>
        </div>
      </div>
      <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800">
        <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Suplemento hoje</div>
        <div class="mt-1"><span class="text-3xl font-semibold num-input" x-text="today.supplementMl"></span> <span class="text-slate-500 text-sm">ml</span></div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="`meta ≈ ${targetDailyMl} ml`"></div>
      </div>
      <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800">
        <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Última mamada</div>
        <div class="mt-1 text-lg font-semibold num-input" x-text="lastFeedingText"></div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="nextFeedingHint"></div>
      </div>
    </div>

    <!-- Ações rápidas -->
    <div class="mb-3 text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 px-1">Registar agora</div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button class="btn-tap p-4 rounded-2xl bg-mint-200 dark:bg-mint-500/30 text-slate-900 dark:text-mint-100 font-semibold text-left" @click="openSheet('feeding')">
        <div class="text-2xl mb-1">🤱</div>
        <div>Mamada</div>
        <div class="text-xs font-normal opacity-70">mama · tetina · misto</div>
      </button>
      <button class="btn-tap p-4 rounded-2xl bg-rose-200 dark:bg-rose-400/30 text-slate-900 dark:text-rose-100 font-semibold text-left" @click="openSheet('diaper')">
        <div class="text-2xl mb-1">💧</div>
        <div>Fralda</div>
        <div class="text-xs font-normal opacity-70">molhada · suja</div>
      </button>
      <button class="btn-tap p-4 rounded-2xl bg-sand-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold text-left" @click="openSheet('weight')">
        <div class="text-2xl mb-1">⚖️</div>
        <div>Peso</div>
        <div class="text-xs font-normal opacity-70" x-text="lastWeight ? `${lastWeight.data.grams} g · ${gainText}` : 'sem registo'"></div>
      </button>
      <button class="btn-tap p-4 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 text-slate-900 dark:text-slate-100 font-semibold text-left" @click="openSheet('pumping')">
        <div class="text-2xl mb-1">🍼</div>
        <div>Extração</div>
        <div class="text-xs font-normal opacity-70">bomba</div>
      </button>
      <button class="btn-tap p-4 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 text-slate-900 dark:text-slate-100 font-semibold text-left" @click="openSheet('promil')">
        <div class="text-2xl mb-1">💊</div>
        <div>ProMil / Vit.</div>
        <div class="text-xs font-normal opacity-70">gotas · suplemento</div>
      </button>
      <button class="btn-tap p-4 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 text-slate-900 dark:text-slate-100 font-semibold text-left" @click="openSheet('colic')">
        <div class="text-2xl mb-1">😣</div>
        <div>Cólica</div>
        <div class="text-xs font-normal opacity-70">intensidade · duração</div>
      </button>
    </div>

    <button class="btn-tap w-full p-3 rounded-2xl bg-white dark:bg-slate-900 border border-dashed border-mint-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 mb-6" @click="openSheet('note')">
      ✏️ Adicionar nota livre
    </button>

    <!-- Suplemento sugerido -->
    <div class="p-4 rounded-2xl bg-mint-100 dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 mb-6" x-show="lastWeight">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Suplemento sugerido</div>
          <div class="mt-1 text-2xl font-semibold num-input">
            <span x-text="supplementPerMeal"></span> <span class="text-base text-slate-500">ml / refeição</span>
          </div>
          <div class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="`${settings.supplement_formula_ml_per_kg} ml/kg/dia ÷ ${settings.supplement_meals_divisor} refeições · peso ${lastWeight?.data?.grams} g`"></div>
        </div>
        <div class="text-3xl">🍼</div>
      </div>
      <template x-if="profile.mother_has_hashimoto">
        <div class="mt-3 text-xs px-3 py-2 rounded-lg bg-rose-100 dark:bg-rose-400/20 text-rose-400 dark:text-rose-200">
          ⚠️ Hashimoto na mãe: escolher fórmula <b>sem iodo adicional</b> quando aplicável (validar com pediatra).
        </div>
      </template>
    </div>

    <!-- Timeline -->
    <div class="flex items-center justify-between mb-2">
      <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 px-1">Últimos registos</div>
      <button class="text-xs text-mint-500 dark:text-mint-200" @click="tab='history'">Ver tudo →</button>
    </div>
    <div class="space-y-2">
      <template x-for="r in recentRecords" :key="r.id">
        <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-mint-200/50 dark:border-slate-800 flex items-start gap-3">
          <div class="text-2xl leading-none pt-0.5" x-text="icon(r.type)"></div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium" x-text="describe(r)"></div>
            <div class="text-xs text-slate-500 dark:text-slate-400 num-input" x-text="timeAgo(r.timestamp) + ' · ' + fmtTime(r.timestamp)"></div>
          </div>
          <button class="btn-tap text-slate-400 hover:text-rose-400 p-1" @click="deleteRecord(r.id)" aria-label="Apagar">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"/></svg>
          </button>
        </div>
      </template>
      <template x-if="recentRecords.length===0">
        <div class="text-center text-slate-500 dark:text-slate-400 text-sm py-6">Sem registos ainda. Toca num botão acima para começar.</div>
      </template>
    </div>
  </section>

  <!-- =========================================================
       TAB: GRÁFICOS
       ========================================================= -->
  <section x-show="tab==='charts'">
    <div class="mb-3 flex gap-2">
      <template x-for="r in ['7','14','30']" :key="r">
        <button class="segbtn btn-tap flex-1 py-2 rounded-xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 text-sm"
                :data-active="chartRange===r" @click="chartRange=r; $nextTick(()=>renderCharts())"
                x-text="`${r} dias`"></button>
      </template>
    </div>

    <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 mb-3">
      <div class="text-sm font-medium mb-2">Peso (g)</div>
      <div class="h-56"><canvas id="chartWeight"></canvas></div>
      <div class="text-xs text-slate-500 dark:text-slate-400 mt-2" x-text="`ganho médio: ${avgGainText}`"></div>
    </div>

    <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 mb-3">
      <div class="text-sm font-medium mb-2">Mamadas por dia</div>
      <div class="h-48"><canvas id="chartFeedings"></canvas></div>
    </div>

    <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 mb-3">
      <div class="text-sm font-medium mb-2">Fraldas por dia</div>
      <div class="h-48"><canvas id="chartDiapers"></canvas></div>
    </div>

    <div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-mint-200/60 dark:border-slate-800 mb-3">
      <div class="text-sm font-medium mb-2">Suplemento (ml) por dia</div>
      <div class="h-48"><canvas id="chartSupplement"></canvas></div>
    </div>
  </section>

  <!-- =========================================================
       TAB: HISTÓRICO
       ========================================================= -->
  <section x-show="tab==='history'">
    <div class="mb-3 flex gap-2 overflow-x-auto pb-1">
      <button class="btn-tap px-3 py-1.5 rounded-full text-sm border segbtn"
              :data-active="histFilter==='all'"
              :class="histFilter==='all' ? '' : 'bg-white dark:bg-slate-900 border-mint-200/60 dark:border-slate-800'"
              @click="histFilter='all'">Todos</button>
      <template x-for="t in ['feeding','diaper','weight','pumping','promil','colic','note']" :key="t">
        <button class="btn-tap px-3 py-1.5 rounded-full text-sm border whitespace-nowrap segbtn"
                :data-active="histFilter===t"
                :class="histFilter===t ? '' : 'bg-white dark:bg-slate-900 border-mint-200/60 dark:border-slate-800'"
                @click="histFilter=t" x-text="icon(t)+' '+labelType(t)"></button>
      </template>
    </div>

    <template x-for="group in groupedHistory" :key="group.day">
      <div class="mb-5">
        <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 px-1 mb-2 num-input" x-text="group.label"></div>
        <div class="space-y-2">
          <template x-for="r in group.items" :key="r.id">
            <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-mint-200/50 dark:border-slate-800 flex items-start gap-3">
              <div class="text-2xl leading-none pt-0.5" x-text="icon(r.type)"></div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium" x-text="describe(r)"></div>
                <div class="text-xs text-slate-500 dark:text-slate-400 num-input" x-text="fmtTime(r.timestamp)"></div>
              </div>
              <button class="btn-tap text-slate-400 hover:text-rose-400 p-1" @click="deleteRecord(r.id)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"/></svg>
              </button>
            </div>
          </template>
        </div>
      </div>
    </template>
    <template x-if="groupedHistory.length===0">
      <div class="text-center text-slate-500 dark:text-slate-400 text-sm py-10">Sem registos.</div>
    </template>
  </section>
</main>

<!-- ============ BOTTOM QUICK FAB (repetir última mamada) ============ -->
<div class="fixed bottom-0 left-0 right-0 z-20 pointer-events-none">
  <div class="max-w-md mx-auto px-4 safe-bottom flex justify-end">
    <button class="pointer-events-auto btn-tap bg-mint-300 hover:bg-mint-400 dark:bg-mint-500 text-slate-900 dark:text-slate-950 font-semibold rounded-full shadow-lg px-5 py-3 flex items-center gap-2"
            @click="openSheet('feeding')">
      <span class="text-xl">＋</span> Mamada
    </button>
  </div>
</div>

<!-- ============ SHEETS (modais bottom-sheet) ============ -->
<template x-if="sheet">
  <div class="fixed inset-0 z-40 flex items-end justify-center backdrop-enter" @click.self="closeSheet()">
    <div class="absolute inset-0 bg-slate-900/40 dark:bg-black/60"></div>
    <div class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sheet-enter max-h-[92vh] overflow-y-auto" @click.stop>
      <div class="sticky top-0 bg-white dark:bg-slate-900 pt-2 pb-3 px-5 border-b border-mint-100 dark:border-slate-800 rounded-t-3xl">
        <div class="w-10 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-3"></div>
        <div class="flex items-center justify-between">
          <div class="text-lg font-semibold" x-text="sheetTitle"></div>
          <button class="btn-tap text-slate-500 p-1" @click="closeSheet()">✕</button>
        </div>
      </div>

      <div class="p-5 space-y-4">
        <!-- Timestamp comum -->
        <template x-if="['feeding','diaper','weight','pumping','promil','colic','note'].includes(sheet)">
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Quando</label>
            <div class="flex gap-2">
              <button class="btn-tap flex-1 py-2 rounded-xl segbtn" :data-active="form.whenChoice==='now'" @click="setWhen('now')">Agora</button>
              <button class="btn-tap flex-1 py-2 rounded-xl segbtn" :data-active="form.whenChoice==='custom'" @click="setWhen('custom')">Personalizar</button>
            </div>
            <template x-if="form.whenChoice==='custom'">
              <input type="datetime-local" class="mt-2 w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" x-model="form.timestamp">
            </template>
          </div>
        </template>

        <!-- ===== FEEDING ===== -->
        <template x-if="sheet==='feeding'">
          <div class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Método</label>
              <div class="grid grid-cols-3 gap-2">
                <template x-for="m in [{v:'mama',l:'Mama',e:'🤱'},{v:'tetina',l:'Tetina',e:'🍼'},{v:'misto',l:'Misto',e:'🤱🍼'}]" :key="m.v">
                  <button class="btn-tap py-3 rounded-xl segbtn" :data-active="form.method===m.v" @click="form.method=m.v">
                    <div class="text-xl" x-text="m.e"></div>
                    <div class="text-xs mt-0.5" x-text="m.l"></div>
                  </button>
                </template>
              </div>
            </div>

            <template x-if="form.method==='mama' || form.method==='misto'">
              <div>
                <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Peito</label>
                <div class="grid grid-cols-3 gap-2">
                  <template x-for="s in [{v:'E',l:'Esquerdo'},{v:'D',l:'Direito'},{v:'ambos',l:'Ambos'}]" :key="s.v">
                    <button class="btn-tap py-2 rounded-xl segbtn text-sm" :data-active="form.side===s.v" @click="form.side=s.v" x-text="s.l"></button>
                  </template>
                </div>
                <div class="mt-3">
                  <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Duração (min)</label>
                  <div class="flex items-center gap-2">
                    <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.duration_min=Math.max(0,(form.duration_min||0)-5)">−</button>
                    <input type="number" inputmode="numeric" class="flex-1 p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 text-center num-input text-lg" x-model.number="form.duration_min">
                    <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.duration_min=(form.duration_min||0)+5">+</button>
                  </div>
                </div>
              </div>
            </template>

            <template x-if="form.method==='tetina' || form.method==='misto'">
              <div>
                <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Suplemento (ml)</label>
                <div class="flex items-center gap-2">
                  <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.ml=Math.max(0,(form.ml||0)-5)">−</button>
                  <input type="number" inputmode="numeric" class="flex-1 p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 text-center num-input text-lg" x-model.number="form.ml">
                  <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.ml=(form.ml||0)+5">+</button>
                </div>
                <button class="btn-tap mt-2 w-full py-2 rounded-xl bg-mint-100 dark:bg-slate-800 text-sm" @click="form.ml=supplementPerMeal">
                  Usar sugestão: <b x-text="supplementPerMeal"></b> ml
                </button>
                <div>
                  <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-3 mb-1">Fonte do leite</label>
                  <div class="grid grid-cols-2 gap-2">
                    <template x-for="s in [{v:'materno',l:'Materno'},{v:'formula',l:'Fórmula'}]" :key="s.v">
                      <button class="btn-tap py-2 rounded-xl segbtn text-sm" :data-active="form.source===s.v" @click="form.source=s.v" x-text="s.l"></button>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Notas (opcional)</label>
              <textarea class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" rows="2" x-model="form.notes" placeholder="ex.: pega difícil, engasgou..."></textarea>
            </div>
          </div>
        </template>

        <!-- ===== DIAPER ===== -->
        <template x-if="sheet==='diaper'">
          <div class="space-y-4">
            <div class="grid grid-cols-3 gap-2">
              <button class="btn-tap py-4 rounded-xl segbtn" :data-active="form.diaperKind==='wet'" @click="form.diaperKind='wet'">
                <div class="text-2xl">💧</div><div class="text-xs mt-1">Molhada</div>
              </button>
              <button class="btn-tap py-4 rounded-xl segbtn" :data-active="form.diaperKind==='poop'" @click="form.diaperKind='poop'">
                <div class="text-2xl">💩</div><div class="text-xs mt-1">Cocó</div>
              </button>
              <button class="btn-tap py-4 rounded-xl segbtn" :data-active="form.diaperKind==='both'" @click="form.diaperKind='both'">
                <div class="text-2xl">💧💩</div><div class="text-xs mt-1">Ambos</div>
              </button>
            </div>
            <template x-if="form.diaperKind==='poop' || form.diaperKind==='both'">
              <div>
                <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Consistência</label>
                <div class="grid grid-cols-4 gap-2">
                  <template x-for="c in ['líquida','pastosa','normal','dura']" :key="c">
                    <button class="btn-tap py-2 rounded-xl segbtn text-xs" :data-active="form.poop_desc===c" @click="form.poop_desc=c" x-text="c"></button>
                  </template>
                </div>
                <div class="mt-3">
                  <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Cor</label>
                  <div class="grid grid-cols-4 gap-2">
                    <template x-for="c in ['amarelada','mostarda','verde','castanha']" :key="c">
                      <button class="btn-tap py-2 rounded-xl segbtn text-xs" :data-active="form.poop_color===c" @click="form.poop_color=c" x-text="c"></button>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- ===== WEIGHT ===== -->
        <template x-if="sheet==='weight'">
          <div class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Peso (gramas)</label>
              <div class="flex items-center gap-2">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.grams=Math.max(0,(form.grams||0)-10)">−</button>
                <input type="number" inputmode="numeric" class="flex-1 p-4 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 text-center num-input text-2xl font-semibold" x-model.number="form.grams" placeholder="2715">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.grams=(form.grams||0)+10">+</button>
              </div>
              <template x-if="lastWeight && form.grams">
                <div class="mt-2 text-sm text-slate-500 dark:text-slate-400 text-center num-input">
                  <span x-text="(form.grams-lastWeight.data.grams>=0?'+':'')+(form.grams-lastWeight.data.grams)"></span> g desde <span x-text="fmtDate(lastWeight.timestamp)"></span>
                </div>
              </template>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Notas</label>
              <input class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" x-model="form.notes" placeholder="ex.: sem fralda, balança de casa">
            </div>
          </div>
        </template>

        <!-- ===== PUMPING ===== -->
        <template x-if="sheet==='pumping'">
          <div class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Quantidade extraída (ml)</label>
              <div class="flex items-center gap-2">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.ml=Math.max(0,(form.ml||0)-5)">−</button>
                <input type="number" inputmode="numeric" class="flex-1 p-4 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 text-center num-input text-2xl font-semibold" x-model.number="form.ml">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.ml=(form.ml||0)+5">+</button>
              </div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Peito</label>
              <div class="grid grid-cols-3 gap-2">
                <template x-for="s in [{v:'E',l:'Esquerdo'},{v:'D',l:'Direito'},{v:'ambos',l:'Ambos'}]" :key="s.v">
                  <button class="btn-tap py-2 rounded-xl segbtn text-sm" :data-active="form.side===s.v" @click="form.side=s.v" x-text="s.l"></button>
                </template>
              </div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Duração (min)</label>
              <input type="number" inputmode="numeric" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="form.duration_min">
            </div>
          </div>
        </template>

        <!-- ===== PROMIL ===== -->
        <template x-if="sheet==='promil'">
          <div class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Nº de gotas</label>
              <div class="flex items-center gap-2">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.drops=Math.max(0,(form.drops||0)-1)">−</button>
                <input type="number" inputmode="numeric" class="flex-1 p-4 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 text-center num-input text-2xl font-semibold" x-model.number="form.drops">
                <button class="btn-tap w-11 h-11 rounded-xl bg-mint-100 dark:bg-slate-800 text-xl" @click="form.drops=(form.drops||0)+1">+</button>
              </div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Produto</label>
              <input class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" x-model="form.product" placeholder="ex.: ProMil, Vit D">
            </div>
          </div>
        </template>

        <!-- ===== COLIC ===== -->
        <template x-if="sheet==='colic'">
          <div class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Intensidade</label>
              <div class="grid grid-cols-5 gap-2">
                <template x-for="n in [1,2,3,4,5]" :key="n">
                  <button class="btn-tap py-4 rounded-xl segbtn text-lg font-semibold" :data-active="form.severity===n" @click="form.severity=n" x-text="n"></button>
                </template>
              </div>
              <div class="text-xs text-slate-500 dark:text-slate-400 mt-1 flex justify-between"><span>leve</span><span>forte</span></div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Duração (min)</label>
              <input type="number" inputmode="numeric" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="form.duration_min">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Notas</label>
              <textarea class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" rows="2" x-model="form.notes"></textarea>
            </div>
          </div>
        </template>

        <!-- ===== NOTE ===== -->
        <template x-if="sheet==='note'">
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1">Nota</label>
            <textarea class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" rows="5" x-model="form.text" placeholder="observação do dia, dúvida para a enfermeira..."></textarea>
          </div>
        </template>

        <!-- ===== SETTINGS ===== -->
        <template x-if="sheet==='settings'">
          <div class="space-y-5">
            <div>
              <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">Perfil</div>
              <div class="space-y-2">
                <div>
                  <label class="text-xs text-slate-500">Nome</label>
                  <input class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" x-model="profile.name">
                </div>
                <div>
                  <label class="text-xs text-slate-500">Data de nascimento</label>
                  <input type="date" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700" x-model="profile.dob">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs text-slate-500">Semanas gest.</label>
                    <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="profile.gestational_weeks">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500">Dias gest.</label>
                    <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="profile.gestational_days">
                  </div>
                </div>
                <div>
                  <label class="text-xs text-slate-500">Peso ao nascer (g)</label>
                  <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="profile.birth_weight_g">
                </div>
                <label class="flex items-center gap-2 p-3 rounded-xl bg-mint-50 dark:bg-slate-800">
                  <input type="checkbox" x-model="profile.mother_has_hashimoto" class="w-5 h-5">
                  <span class="text-sm">Mãe com Hashimoto (fórmula sem iodo)</span>
                </label>
              </div>
            </div>

            <div>
              <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">Metas & Cálculos</div>
              <div class="space-y-2">
                <div>
                  <label class="text-xs text-slate-500">Mamadas/dia (meta)</label>
                  <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="settings.target_feedings_per_day">
                </div>
                <div>
                  <label class="text-xs text-slate-500">Mínimo fraldas molhadas/dia</label>
                  <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="settings.min_wet_diapers">
                </div>
                <div>
                  <label class="text-xs text-slate-500">Ganho mín. peso g/dia</label>
                  <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="settings.min_weight_gain_g_per_day">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs text-slate-500">Fórmula ml/kg/dia</label>
                    <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="settings.supplement_formula_ml_per_kg">
                  </div>
                  <div>
                    <label class="text-xs text-slate-500">Nº refeições</label>
                    <input type="number" class="w-full p-3 rounded-xl bg-mint-50 dark:bg-slate-800 border border-mint-200 dark:border-slate-700 num-input" x-model.number="settings.supplement_meals_divisor">
                  </div>
                </div>
              </div>
            </div>

            <div>
              <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">Dados</div>
              <div class="grid grid-cols-2 gap-2">
                <button class="btn-tap py-3 rounded-xl bg-mint-100 dark:bg-slate-800 text-sm font-medium" @click="exportData()">⬇️ Exportar JSON</button>
                <label class="btn-tap py-3 rounded-xl bg-mint-100 dark:bg-slate-800 text-sm font-medium text-center cursor-pointer">
                  ⬆️ Importar
                  <input type="file" accept="application/json" class="hidden" @change="importData($event)">
                </label>
                <button class="btn-tap col-span-2 py-3 rounded-xl bg-rose-200 dark:bg-rose-400/30 text-sm font-medium" @click="clearAll()">🗑️ Apagar tudo</button>
              </div>
              <div class="mt-3 text-xs text-slate-500 dark:text-slate-400 text-center">
                <span x-text="records.length"></span> registos guardados neste dispositivo.
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="sticky bottom-0 bg-white dark:bg-slate-900 border-t border-mint-100 dark:border-slate-800 p-4 safe-bottom">
        <template x-if="sheet==='settings'">
          <button class="btn-tap w-full py-4 rounded-2xl bg-mint-300 dark:bg-mint-500 text-slate-900 dark:text-slate-950 font-semibold text-lg" @click="saveSettings()">Guardar</button>
        </template>
        <template x-if="sheet!=='settings'">
          <button class="btn-tap w-full py-4 rounded-2xl bg-mint-300 dark:bg-mint-500 text-slate-900 dark:text-slate-950 font-semibold text-lg" @click="saveRecord()">Guardar registo</button>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- ============ TOAST ============ -->
<div x-show="toast" x-transition class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-2 rounded-full bg-slate-900 text-white text-sm shadow-lg" x-text="toast"></div>

<script>
// ---- Service worker inline (para PWA instalável) ----
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'bernardo-v1';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      const req = e.request;
      if (req.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE).then(async cache => {
          const cached = await cache.match(req);
          const fetched = fetch(req).then(res => {
            if (res && res.status === 200 && (req.url.startsWith('http'))) {
              try { cache.put(req, res.clone()); } catch(_){}
            }
            return res;
          }).catch(() => cached);
          return cached || fetched;
        })
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

// ---- App state ----
function uuid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
}

function app() {
  return {
    theme: 'light',
    tab: 'today',
    tabs: [{id:'today',label:'Hoje'},{id:'charts',label:'Gráficos'},{id:'history',label:'Histórico'}],
    sheet: null,
    sheetTitle: '',
    toast: '',
    profile: {
      name: 'Bernardo',
      dob: '2026-07-04',
      gestational_weeks: 35,
      gestational_days: 3,
      birth_weight_g: 2715,
      mother_has_hashimoto: true
    },
    settings: {
      target_feedings_per_day: 10,
      min_wet_diapers: 6,
      min_weight_gain_g_per_day: 20,
      supplement_formula_ml_per_kg: 150,
      supplement_meals_divisor: 8
    },
    records: [],
    form: {},
    chartRange: '14',
    histFilter: 'all',
    _charts: {},

    // ---- init / storage
    init() {
      const p = localStorage.getItem('bernardo_profile');
      if (p) Object.assign(this.profile, JSON.parse(p));
      const s = localStorage.getItem('bernardo_settings');
      if (s) Object.assign(this.settings, JSON.parse(s));
      const r = localStorage.getItem('bernardo_records');
      if (r) this.records = JSON.parse(r);
      this.theme = localStorage.getItem('bernardo_theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      this.$watch('records', v => localStorage.setItem('bernardo_records', JSON.stringify(v)));
      this.$watch('profile', v => localStorage.setItem('bernardo_profile', JSON.stringify(v)));
      this.$watch('settings', v => localStorage.setItem('bernardo_settings', JSON.stringify(v)));
      this.$watch('tab', v => { if (v==='charts') this.$nextTick(()=>this.renderCharts()); });
    },

    toggleTheme() {
      this.theme = this.theme==='dark' ? 'light' : 'dark';
      localStorage.setItem('bernardo_theme', this.theme);
      if (this.tab==='charts') this.$nextTick(()=>this.renderCharts());
    },

    // ---- age
    get ageDays() {
      if (!this.profile.dob) return 0;
      const d = new Date(this.profile.dob);
      return Math.floor((Date.now() - d.getTime())/86400000);
    },
    get ageText() {
      const d = this.ageDays;
      if (!d && !this.profile.dob) return '';
      if (d < 14) return `${d} dias`;
      if (d < 60) return `${Math.floor(d/7)} sem ${d%7} d`;
      const m = Math.floor(d/30.44);
      return `${m} meses`;
    },
    get correctedAgeText() {
      const dob = new Date(this.profile.dob);
      if (isNaN(dob)) return '';
      const gestDays = (this.profile.gestational_weeks||40)*7 + (this.profile.gestational_days||0);
      const preemieDays = 40*7 - gestDays;
      const corrected = this.ageDays - preemieDays;
      if (corrected < 0) return `idade corrigida: ${corrected} d`;
      if (corrected < 14) return `corr: ${corrected} d`;
      return `corr: ${Math.floor(corrected/7)}s ${corrected%7}d`;
    },

    // ---- derived
    startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); },
    isToday(ts) { const t = new Date(ts).getTime(); return t >= this.startOfToday() && t < this.startOfToday()+86400000; },

    get todayRecords() { return this.records.filter(r => this.isToday(r.timestamp)); },
    get today() {
      const tr = this.todayRecords;
      const feedings = tr.filter(r => r.type==='feeding').length;
      const wetDiapers = tr.filter(r => r.type==='diaper' && (r.data.diaperKind==='wet' || r.data.diaperKind==='both')).length;
      const supplementMl = tr.filter(r => r.type==='feeding').reduce((s,r) => s + (Number(r.data.ml)||0), 0);
      return { feedings, wetDiapers, supplementMl };
    },
    get lastFeeding() {
      return this.records.filter(r => r.type==='feeding').sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0];
    },
    get lastFeedingText() {
      if (!this.lastFeeding) return '—';
      const min = Math.floor((Date.now()-new Date(this.lastFeeding.timestamp).getTime())/60000);
      if (min < 60) return `há ${min} min`;
      return `há ${Math.floor(min/60)}h ${min%60}m`;
    },
    get nextFeedingHint() {
      if (!this.lastFeeding) return 'sem registo';
      const target = 24*60 / (this.settings.target_feedings_per_day || 10);
      const min = Math.floor((Date.now()-new Date(this.lastFeeding.timestamp).getTime())/60000);
      const remaining = Math.max(0, Math.round(target - min));
      if (remaining <= 0) return 'próxima: agora';
      return `próxima em ~${remaining} min`;
    },
    get lastWeight() {
      return this.records.filter(r => r.type==='weight').sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0];
    },
    get gainText() {
      const weights = this.records.filter(r=>r.type==='weight').sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      if (weights.length < 2) return 'primeiro registo';
      const last = weights[weights.length-1], prev = weights[weights.length-2];
      const days = Math.max(1, (new Date(last.timestamp)-new Date(prev.timestamp))/86400000);
      const dg = last.data.grams - prev.data.grams;
      return `${dg>=0?'+':''}${Math.round(dg/days)} g/dia`;
    },
    get avgGainText() {
      const weights = this.records.filter(r=>r.type==='weight').sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      if (weights.length < 2) return 'insuficiente';
      const first = weights[0], last = weights[weights.length-1];
      const days = Math.max(1, (new Date(last.timestamp)-new Date(first.timestamp))/86400000);
      const dg = last.data.grams - first.data.grams;
      return `${(dg/days).toFixed(1)} g/dia (mín. ${this.settings.min_weight_gain_g_per_day})`;
    },
    get supplementPerMeal() {
      const w = this.lastWeight?.data?.grams || this.profile.birth_weight_g;
      if (!w) return 0;
      const daily = (w/1000) * this.settings.supplement_formula_ml_per_kg;
      return Math.round(daily / this.settings.supplement_meals_divisor);
    },
    get targetDailyMl() {
      const w = this.lastWeight?.data?.grams || this.profile.birth_weight_g;
      if (!w) return 0;
      return Math.round((w/1000) * this.settings.supplement_formula_ml_per_kg);
    },
    get recentRecords() {
      return [...this.records].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp)).slice(0,6);
    },
    get groupedHistory() {
      const filtered = this.histFilter==='all' ? this.records : this.records.filter(r => r.type===this.histFilter);
      const sorted = [...filtered].sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
      const groups = {};
      for (const r of sorted) {
        const d = new Date(r.timestamp); d.setHours(0,0,0,0);
        const key = d.getTime();
        if (!groups[key]) groups[key] = { day: key, label: this.dayLabel(d), items: [] };
        groups[key].items.push(r);
      }
      return Object.values(groups);
    },

    // ---- formatters
    icon(t) { return {feeding:'🤱',diaper:'💧',weight:'⚖️',pumping:'🍼',promil:'💊',colic:'😣',note:'✏️'}[t] || '•'; },
    labelType(t) { return {feeding:'Mamada',diaper:'Fralda',weight:'Peso',pumping:'Extração',promil:'ProMil',colic:'Cólica',note:'Nota'}[t] || t; },
    fmtTime(ts) { const d = new Date(ts); return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); },
    fmtDate(ts) { const d = new Date(ts); return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'short'}); },
    dayLabel(d) {
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((today.getTime()-d.getTime())/86400000);
      if (diff===0) return 'Hoje';
      if (diff===1) return 'Ontem';
      if (diff<7) return d.toLocaleDateString('pt-PT',{weekday:'long'});
      return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'long'});
    },
    timeAgo(ts) {
      const m = Math.floor((Date.now()-new Date(ts).getTime())/60000);
      if (m<1) return 'agora';
      if (m<60) return `há ${m} min`;
      const h = Math.floor(m/60);
      if (h<24) return `há ${h}h`;
      return `há ${Math.floor(h/24)} d`;
    },
    describe(r) {
      const d = r.data || {};
      switch (r.type) {
        case 'feeding': {
          const parts = [];
          if (d.method==='mama') parts.push('Mama');
          else if (d.method==='tetina') parts.push('Tetina');
          else if (d.method==='misto') parts.push('Misto');
          if ((d.method==='mama'||d.method==='misto') && d.side) parts.push(({E:'E',D:'D',ambos:'E+D'})[d.side]);
          if ((d.method==='mama'||d.method==='misto') && d.duration_min) parts.push(`${d.duration_min} min`);
          if ((d.method==='tetina'||d.method==='misto') && d.ml) parts.push(`${d.ml} ml${d.source==='formula'?' fórm.':' mat.'}`);
          if (d.notes) parts.push(`— ${d.notes}`);
          return parts.join(' · ');
        }
        case 'diaper': {
          const k = {wet:'Molhada',poop:'Cocó',both:'Molhada + Cocó'}[d.diaperKind] || '';
          const extras = [d.poop_desc, d.poop_color].filter(Boolean).join(', ');
          return extras ? `${k} (${extras})` : k;
        }
        case 'weight': return `${d.grams} g${d.notes?' · '+d.notes:''}`;
        case 'pumping': {
          const parts = [`${d.ml||0} ml`];
          if (d.side) parts.push(({E:'E',D:'D',ambos:'E+D'})[d.side]);
          if (d.duration_min) parts.push(`${d.duration_min} min`);
          return parts.join(' · ');
        }
        case 'promil': return `${d.drops||0} gotas${d.product?' · '+d.product:''}`;
        case 'colic': return `Intensidade ${d.severity||'?'}${d.duration_min?' · '+d.duration_min+' min':''}${d.notes?' — '+d.notes:''}`;
        case 'note': return d.text || '(vazio)';
        default: return JSON.stringify(d);
      }
    },

    // ---- sheets
    openSheet(kind) {
      this.sheet = kind;
      this.sheetTitle = {
        feeding:'Mamada', diaper:'Fralda', weight:'Peso', pumping:'Extração',
        promil:'ProMil / Suplemento', colic:'Cólica', note:'Nota', settings:'Definições'
      }[kind] || '';
      this.form = this.defaultForm(kind);
    },
    closeSheet() { this.sheet = null; },
    setWhen(choice) {
      this.form.whenChoice = choice;
      if (choice==='custom' && !this.form.timestamp) {
        this.form.timestamp = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
      }
    },
    defaultForm(kind) {
      const base = { whenChoice: 'now', timestamp: '' };
      switch (kind) {
        case 'feeding': return { ...base, method:'mama', side:'E', duration_min:15, ml:0, source:'materno', notes:'' };
        case 'diaper': return { ...base, diaperKind:'wet', poop_desc:'', poop_color:'' };
        case 'weight': return { ...base, grams: this.lastWeight?.data?.grams || this.profile.birth_weight_g || 0, notes:'' };
        case 'pumping': return { ...base, ml:0, side:'ambos', duration_min:15 };
        case 'promil': return { ...base, drops:1, product:'ProMil' };
        case 'colic': return { ...base, severity:3, duration_min:10, notes:'' };
        case 'note': return { ...base, text:'' };
        default: return base;
      }
    },
    computeTimestamp() {
      if (this.form.whenChoice==='custom' && this.form.timestamp) {
        return new Date(this.form.timestamp).toISOString();
      }
      return new Date().toISOString();
    },
    saveRecord() {
      const { whenChoice, timestamp, ...data } = this.form;
      const r = { id: uuid(), type: this.sheet, timestamp: this.computeTimestamp(), data };
      this.records = [...this.records, r];
      this.showToast(`✓ ${this.labelType(this.sheet)} guardada`);
      this.closeSheet();
    },
    saveSettings() {
      localStorage.setItem('bernardo_profile', JSON.stringify(this.profile));
      localStorage.setItem('bernardo_settings', JSON.stringify(this.settings));
      this.showToast('✓ Definições guardadas');
      this.closeSheet();
    },
    deleteRecord(id) {
      if (!confirm('Apagar este registo?')) return;
      this.records = this.records.filter(r => r.id !== id);
      this.showToast('Registo apagado');
    },
    clearAll() {
      if (!confirm('Apagar TODOS os registos? Esta ação é irreversível.')) return;
      if (!confirm('Tens a certeza absoluta?')) return;
      this.records = [];
      this.showToast('Todos os registos apagados');
    },
    exportData() {
      const payload = { profile: this.profile, settings: this.settings, records: this.records, exported_at: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `bernardo-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      this.showToast('Dados exportados');
    },
    async importData(ev) {
      const file = ev.target.files[0]; if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.profile) Object.assign(this.profile, data.profile);
        if (data.settings) Object.assign(this.settings, data.settings);
        if (Array.isArray(data.records)) {
          const existing = new Set(this.records.map(r => r.id));
          const merged = [...this.records, ...data.records.filter(r => !existing.has(r.id))];
          this.records = merged;
        }
        this.showToast('✓ Dados importados');
      } catch (e) {
        alert('Ficheiro inválido: ' + e.message);
      }
    },
    showToast(msg) {
      this.toast = msg;
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => this.toast = '', 2200);
    },

    // ---- charts
    renderCharts() {
      const days = parseInt(this.chartRange, 10);
      const isDark = this.theme==='dark';
      const grid = isDark ? '#1e293b' : '#E4DBC8';
      const text = isDark ? '#94a3b8' : '#64748b';
      Chart.defaults.color = text;
      Chart.defaults.borderColor = grid;
      Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif';

      const dayKeys = [];
      for (let i=days-1; i>=0; i--) {
        const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
        dayKeys.push(d);
      }
      const labels = dayKeys.map(d => d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'}));

      const feedingsPerDay = dayKeys.map(d => this.records.filter(r => r.type==='feeding' && new Date(r.timestamp).setHours(0,0,0,0)===d.getTime()).length);
      const wetPerDay = dayKeys.map(d => this.records.filter(r => r.type==='diaper' && (r.data.diaperKind==='wet' || r.data.diaperKind==='both') && new Date(r.timestamp).setHours(0,0,0,0)===d.getTime()).length);
      const poopPerDay = dayKeys.map(d => this.records.filter(r => r.type==='diaper' && (r.data.diaperKind==='poop' || r.data.diaperKind==='both') && new Date(r.timestamp).setHours(0,0,0,0)===d.getTime()).length);
      const supPerDay = dayKeys.map(d => this.records.filter(r => r.type==='feeding' && new Date(r.timestamp).setHours(0,0,0,0)===d.getTime()).reduce((s,r) => s + (Number(r.data.ml)||0), 0));

      const weightsAll = this.records.filter(r => r.type==='weight').sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp));
      const cutoff = Date.now() - days*86400000;
      const weights = weightsAll.filter(r => new Date(r.timestamp).getTime() >= cutoff);

      this._chart('chartWeight', {
        type: 'line',
        data: {
          datasets: [{
            label: 'Peso (g)',
            data: weights.map(r => ({ x: r.timestamp, y: r.data.grams })),
            borderColor: '#2E9599', backgroundColor: 'rgba(168,218,220,.35)',
            tension: 0.25, fill: true, pointRadius: 4, pointBackgroundColor: '#2E9599'
          }]
        },
        options: {
          maintainAspectRatio: false, responsive: true,
          scales: { x: { type: 'time', time: { unit: days>14?'week':'day', tooltipFormat: 'dd/MM' }, grid: { color: grid } }, y: { grid: { color: grid } } },
          plugins: { legend: { display: false } }
        }
      });

      this._chart('chartFeedings', {
        type: 'bar',
        data: { labels, datasets: [{ label:'Mamadas', data: feedingsPerDay, backgroundColor: '#A8DADC' }] },
        options: { maintainAspectRatio:false, responsive:true, plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{ color: grid } }, y:{ beginAtZero:true, grid:{ color: grid } } } }
      });

      this._chart('chartDiapers', {
        type: 'bar',
        data: { labels, datasets: [
          { label:'Molhadas', data: wetPerDay, backgroundColor: '#7BC7CA' },
          { label:'Cocó', data: poopPerDay, backgroundColor: '#F1B0B7' }
        ]},
        options: { maintainAspectRatio:false, responsive:true, scales:{ x:{ stacked:true, grid:{ color: grid } }, y:{ stacked:true, beginAtZero:true, grid:{ color: grid } } } }
      });

      this._chart('chartSupplement', {
        type: 'line',
        data: { labels, datasets: [{ label:'ml', data: supPerDay, borderColor:'#D26571', backgroundColor:'rgba(241,176,183,.35)', tension:.25, fill:true, pointRadius:3 }] },
        options: { maintainAspectRatio:false, responsive:true, plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{ color: grid } }, y:{ beginAtZero:true, grid:{ color: grid } } } }
      });
    },
    _chart(id, cfg) {
      const el = document.getElementById(id);
      if (!el) return;
      if (this._charts[id]) this._charts[id].destroy();
      this._charts[id] = new Chart(el.getContext('2d'), cfg);
    }
  }
}
</script>
